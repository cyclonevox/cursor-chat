name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart analyze
      - run: flutter test

      - name: Write upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload keystore secret; APK will be debug-signed."
            exit 0
          fi
          KEYSTORE="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
            echo "storeFile=$KEYSTORE"
          } > android/key.properties

      - name: Build APK
        id: build
        run: |
          VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)
          BUILD=$((10000 + GITHUB_RUN_NUMBER))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/cursor-chat.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/cursor-chat-$VERSION.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          BUILD: ${{ steps.build.outputs.build }}
        run: |
          TAG="v${VERSION}"
          TITLE="Cursor Chat ${VERSION}"
          NOTES="$(cat <<EOF
          ## Install

          Download \`cursor-chat.apk\` (or \`cursor-chat-${VERSION}.apk\`) and allow unknown sources.

          从本页下载 APK，允许未知来源后安装。需要 [Cursor API Key](https://cursor.com/dashboard/api)。

          合并进 \`main\` 后由 GitHub Actions 自动打包。这是 build ${BUILD}。
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/cursor-chat.apk "dist/cursor-chat-${VERSION}.apk" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" dist/cursor-chat.apk "dist/cursor-chat-${VERSION}.apk" \
              --title "$TITLE" --notes "$NOTES" --latest
          fi
